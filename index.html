<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мир Тачек — тачки для сада и дома, сварочное оборудование</title>
  <meta name="description" content="Мир Тачек: садовые и строительные тачки, колеса и комплектующие, сварочное оборудование и расходники. Заказ онлайн и через WhatsApp, работа с магазинами и дилерами.">
  <meta name="theme-color" content="#15171c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e4572e' stroke-width='2.4'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Ccircle cx='12' cy='12' r='2.5'/%3E%3Cpath d='M12 3v6.5M12 14.5V21M3 12h6.5M14.5 12H21'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#catalog" data-action="nav" data-view="catalog" aria-label="На главную">
        <span class="brand__mark" id="brandMark"></span>
        <span class="brand__text"><strong id="brandName">Мир Тачек</strong><small>тачки для сада и дома · сварка</small></span>
      </a>
      <div class="topbar__right">
        <span class="conn" id="connStatus" role="status"></span>
        <div id="userBox" class="user-box"></div>
        <button type="button" class="icon-btn icon-btn--dark cart-btn" id="cartBtn" data-action="nav" data-view="cart" title="Корзина" aria-label="Корзина"></button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
  </header>
  <div id="banner"></div>

  <main class="main" id="main">
    <section class="view" id="view-catalog" aria-label="Каталог"></section>
    <section class="view" id="view-favorites" aria-label="Избранное" hidden></section>
    <section class="view" id="view-cart" aria-label="Корзина" hidden></section>
    <section class="view" id="view-orders" aria-label="Заказы" hidden></section>
    <section class="view" id="view-docs" aria-label="Документы и оплаты" hidden></section>
    <section class="view" id="view-reports" aria-label="Отчеты" hidden></section>
    <section class="view" id="view-crm" aria-label="CRM и WhatsApp" hidden></section>
    <section class="view" id="view-manage" aria-label="Управление" hidden></section>
  </main>

  <footer class="footer"><span>Мир Тачек</span><span class="muted">Тачки для сада и дома · сварочные изделия · магазины и дилеры</span></footer>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-action="close-modal"></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button type="button" class="modal__close" id="modalClose" data-action="close-modal" aria-label="Закрыть"></button>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="print-area" aria-hidden="true"></div>
  <noscript><p style="padding:20px">Для работы сайта включите JavaScript.</p></noscript>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
